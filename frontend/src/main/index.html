<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Medical Online Store</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
              rel="stylesheet">

        <!-- CSS File -->
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="#">
                Medical Online Store
            </a>

        </div>

    </nav>

    <!-- Header -->
    <div class="container mt-5">

        <div class="text-center mb-5">

            <h1 class="main-title">
                Available Medicines
            </h1>

            <p class="sub-title">
                Buy medicines online safely and easily
            </p>

        </div>

        <!-- Medicine Cards -->
        <div class="row">

            <!-- Card 1 -->
            <div class="col-md-4 mb-4">

                <div class="card medicine-card">

                    <img src="images/paracetamol.jpg"
                         class="card-img-top medicine-img"
                         alt="Paracetamol">

                    <div class="card-body">

                        <h5 class="card-title">
                            Paracetamol
                        </h5>

                        <p class="card-text">
                            Used for fever and pain relief.
                        </p>

                        <h6 class="price">
                            Rs. 250
                        </h6>

                        <button class="btn buy-btn"
                                onclick="buyMedicine('Paracetamol')">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

            <!-- Card 2 -->
            <div class="col-md-4 mb-4">

                <div class="card medicine-card">

                    <img src="images/vitaminc.jpg"
                         class="card-img-top medicine-img"
                         alt="Vitamin C">

                    <div class="card-body">

                        <h5 class="card-title">
                            Vitamin C
                        </h5>

                        <p class="card-text">
                            Helps improve immunity.
                        </p>

                        <h6 class="price">
                            Rs. 500
                        </h6>

                        <button class="btn buy-btn"
                                onclick="buyMedicine('Vitamin C')">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

            <!-- Card 3 -->
            <div class="col-md-4 mb-4">

                <div class="card medicine-card">

                    <img src="images/cough.jpg"
                         class="card-img-top medicine-img"
                         alt="Cough Syrup">

                    <div class="card-body">

                        <h5 class="card-title">
                            Cough Syrup
                        </h5>

                        <p class="card-text">
                            Effective for cough and cold.
                        </p>

                        <h6 class="price">
                            Rs. 750
                        </h6>

                        <button class="btn buy-btn"
                                onclick="buyMedicine('Cough Syrup')">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- JS File -->
    <script src="js/script.js"></script>

    </body>
    </html>
