<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Payment System</title>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container">

    <!-- HEADER -->

    <div class="dashboard-header">

      <div class="logo">
        <div class="logo-box">✚</div>

        <h1>Medi<span>Core</span></h1>
      </div>

    </div>

    <!-- TABLE CARD -->

    <div class="glass-card">

      <div class="table-title">
        <h2>Medicine Payment Dashboard</h2>
        <p>Manage medicine orders and payment receipts securely.</p>
      </div>

      <table>

        <thead>
          <tr>
            <th>Reg No</th>
            <th>Patient Name</th>
            <th>Medicine Price</th>
            <th>Payment Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>

          <tr>
            <td>REG-1001</td>
            <td>John Doe</td>
            <td>$120</td>
            <td>
              <span class="status unpaid">Unpaid</span>
            </td>
            <td>
              <button class="pay-btn">Pay Receipt</button>
            </td>
          </tr>

          <tr>
            <td>REG-1002</td>
            <td>Jane Smith</td>
            <td>$85</td>
            <td>
              <span class="status delivered">Delivered</span>
            </td>
            <td>
              <button class="pay-btn">Pay Receipt</button>
            </td>
          </tr>

          <tr>
            <td>REG-1003</td>
            <td>Michael Lee</td>
            <td>$220</td>
            <td>
              <span class="status paid">Paid</span>
            </td>
            <td>
              <button class="pay-btn">Pay Receipt</button>
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

  <!-- POPUP -->

  <div class="popup" id="paymentPopup">

    <div class="popup-content">

      <span class="close-btn" id="closePopup">&times;</span>

      <h2>Payment Process</h2>

      <div class="method-buttons">
        <button id="cashBtn">Cash</button>
        <button id="cardBtn">Card</button>
      </div>

      <form id="cardForm" class="hidden">

        <input type="text" placeholder="Card Holder Name" required>

        <input type="text" placeholder="Card Number" maxlength="16" required>

        <div class="row">
          <input type="text" placeholder="MM/YY" required>
          <input type="text" placeholder="CVV" maxlength="3" required>
        </div>

        <button type="submit" class="submit-btn">
          Process Payment
        </button>

      </form>

      <div id="message"></div>

    </div>

  </div>

  <script src="js/app.js"></script>

</body>
</html>
