<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Medical Payment Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
    <div class="payment-card">
        <h1>Medical Payment</h1>

        <div class="bill-box">
            <h2>Hospital Bill</h2>
            <p>Patient: John Doe</p>
            <p>Appointment: General Checkup</p>
            <p class="amount">Total: $150</p>
        </div>

        <button id="payBtn" class="pay-btn">Pay Here</button>
    </div>
</div>

<!-- Popup -->
<div class="popup" id="paymentPopup">
    <div class="popup-content">

        <span class="close-btn" id="closePopup">&times;</span>

        <h2>Select Payment Method</h2>

        <div class="method-buttons">
            <button id="cashBtn">Cash</button>
            <button id="cardBtn">Card</button>
        </div>

        <!-- Card Form -->
        <form id="cardForm" class="hidden">

            <input type="text" placeholder="Card Holder Name" required>

            <input type="text" placeholder="Card Number" maxlength="16" required>

            <div class="row">
                <input type="text" placeholder="MM/YY" required>
                <input type="text" placeholder="CVV" maxlength="3" required>
            </div>

            <button type="submit" class="submit-btn">
                Process Payment
            </button>

        </form>

        <div id="message"></div>

    </div>
</div>

<script src="js/app.js"></script>

</body>
</html>
